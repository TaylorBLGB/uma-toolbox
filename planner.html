<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Race Planner — UmaToolbox</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>
<main>
  <h1 class="page-title">Race Planner</h1>
  <p class="page-subtitle">
    Click a slot to assign a race, or use Auto-Fill to maximize total fans automatically.
  </p>

  <div class="planner-toolbar card">
    <div class="toolbar-row">
      <div class="toolbar-actions">
        <button id="autofill-btn" class="primary">Auto-Fill</button>
        <button id="reset-btn">Reset</button>
        <button id="filters-toggle-btn">Filters</button>
      </div>
      <div class="toolbar-badges" id="stat-badges"></div>
    </div>

    <div id="filters-panel">
      <div class="toolbar-row">
        <div class="filter-group">
          <span class="filter-group-label">Trainee</span>
          <img id="trainee-portrait" class="trainee-portrait hidden" alt="">
          <div class="trainee-search">
            <input type="text" id="trainee-input" placeholder="Search by name&hellip;" autocomplete="off">
            <div id="trainee-suggestions" class="trainee-suggestions hidden"></div>
          </div>
          <label class="checkbox-row"><input type="checkbox" id="include-unreleased"> Include unreleased</label>
        </div>
        <div class="filter-group">
          <span class="filter-group-label">Max consecutive races</span>
          <input type="number" id="max-streak" min="1" max="10" value="5" style="width:60px;">
        </div>
        <div class="filter-group">
          <span class="filter-group-label">Fan bonus</span>
          <input type="number" id="fan-bonus" min="0" max="500" value="0" style="width:60px;"> %
        </div>
      </div>

      <div class="apt-panel">
        <div class="apt-section">
          <div class="apt-section-header">Surface</div>
          <div class="apt-controls" id="aptitude-controls-surface"></div>
        </div>
        <div class="apt-section">
          <div class="apt-section-header">Distance</div>
          <div class="apt-controls" id="aptitude-controls-dist"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="planner-body">
    <p class="result-count">Loading race calendar&hellip;</p>
  </div>

  <div id="picker-modal" class="modal-backdrop hidden">
    <div class="modal-panel">
      <div class="modal-header">
        <h3 id="picker-title"></h3>
        <button id="picker-close" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body" id="picker-options"></div>
    </div>
  </div>
</main>
<script src="js/common.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/planner.js"></script>
</body>
</html>
