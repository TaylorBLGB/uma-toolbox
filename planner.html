<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Race Planner — UmaToolbox</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>
<main>
  <h1 class="page-title">Race Planner</h1>
  <p class="page-subtitle">
    Click a slot to assign a race, or use Auto-Fill to maximize total fans automatically. Your picks are
    saved in this browser only — nothing is sent anywhere.
  </p>

  <div class="planner-toolbar card">
    <div class="toolbar-row">
      <div class="toolbar-actions">
        <button id="autofill-btn" class="primary">Auto-Fill</button>
        <button id="reset-btn">Reset</button>
        <button id="share-btn">Share</button>
        <button id="filters-toggle-btn">Filters</button>
      </div>
      <div class="toolbar-badges" id="stat-badges"></div>
    </div>

    <div class="toolbar-row" id="filters-panel">
      <div class="filter-group">
        <span class="filter-group-label">Trainee</span>
        <select id="trainee-select"><option value="">None</option></select>
      </div>
      <div class="filter-group">
        <span class="filter-group-label">Surface</span>
        <label class="checkbox-row"><input type="checkbox" data-apt="surface-turf" checked> Turf</label>
        <label class="checkbox-row"><input type="checkbox" data-apt="surface-dirt"> Dirt</label>
      </div>
      <div class="filter-group">
        <span class="filter-group-label">Distance</span>
        <label class="checkbox-row"><input type="checkbox" data-apt="dist-Short"> Short</label>
        <label class="checkbox-row"><input type="checkbox" data-apt="dist-Mile" checked> Mile</label>
        <label class="checkbox-row"><input type="checkbox" data-apt="dist-Medium" checked> Medium</label>
        <label class="checkbox-row"><input type="checkbox" data-apt="dist-Long" checked> Long</label>
      </div>
      <div class="filter-group">
        <span class="filter-group-label">Max consecutive races</span>
        <input type="number" id="max-streak" min="1" max="10" value="4" style="width:60px;">
      </div>
    </div>

    <div id="trainee-banner" class="hidden"></div>
  </div>

  <div id="planner-body">
    <p class="result-count">Loading race calendar&hellip;</p>
  </div>

  <div id="picker-modal" class="modal-backdrop hidden">
    <div class="modal-panel">
      <div class="modal-header">
        <h3 id="picker-title"></h3>
        <button id="picker-close" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body" id="picker-options"></div>
    </div>
  </div>
</main>
<script src="js/common.js"></script>
<script src="js/planner.js"></script>
</body>
</html>
